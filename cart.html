<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Cart | FoodieHub</title>

    <link rel="stylesheet"
          href="cart.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<!--=========================
Navbar
==========================-->

<header>

    <nav class="navbar">

        <a href="index.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Continue Shopping

        </a>

        <h2 class="logo">

            🛒 My Cart

        </h2>

        <div class="cart-items">

            3 Items

        </div>

    </nav>

</header>

<!--=========================
Main Container
==========================-->

<div class="cart-container">

<!--=========================
Left Section
==========================-->

<div class="cart-left">

<!--=========================
Restaurant
==========================-->

<div class="restaurant-box">

<h2>

🍕 Pizza Palace

</h2>

<p>

Italian • Pizza • Fast Food

</p>

</div>

<div id="cartItems"></div>

<!--=========================
Special Instructions
==========================-->

<div class="instructions">

<h3>

Special Instructions

</h3>

<textarea placeholder="Add cooking instructions..."></textarea>

</div>

</div>

<!--=========================
Right Section
==========================-->

<div class="cart-right">

<!--=========================
Coupon
==========================-->

<div class="coupon-box">

<h3>

Apply Coupon

</h3>

<div class="coupon-input">

<input type="text"
placeholder="Enter Coupon Code">

<button>

Apply

</button>

</div>

</div>

<!--=========================
Bill Summary
==========================-->

<div class="bill-box">

<h2>

Bill Details

</h2>

<div class="bill-row">

<span>

Item Total

</span>

<span id="subtotal">

₹1346

</span>

</div>

<div class="bill-row">

<span>

GST (5%)

</span>

<span id="gst">

₹67.30

</span>

</div>

<div class="bill-row">

<span>

Platform Fee

</span>

<span>

₹10

</span>

</div>

<div class="bill-row">

<span>

Delivery Fee

</span>

<span>

₹40

</span>

</div>

<div class="bill-row discount">

<span>

Discount

</span>

<span id="discount">

-₹0

</span>

</div>

<hr>

<div class="bill-row total">

<span>

Grand Total

</span>

<span id="grandTotal">

₹1463.30

</span>

</div>

<button class="checkout">

Proceed To Checkout

</button>

<a href="index.html">

<button class="continue">

Continue Shopping

</button>

</a>

</div>

<!--=========================
Payment Methods
==========================-->

<div class="payment-box">

<h3>

Accepted Payments

</h3>

<div class="payments">

<i class="fa-brands fa-cc-visa"></i>

<i class="fa-brands fa-cc-mastercard"></i>

<i class="fa-brands fa-google-pay"></i>

<i class="fa-brands fa-paypal"></i>

</div>

<p>

🔒 100% Secure Payments

</p>

</div>

</div>

</div>

<script src="cart.js"></script>

</body>

</html>
